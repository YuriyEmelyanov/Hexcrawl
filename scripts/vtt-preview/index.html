<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HexCrawl · изолированный прогон VTT</title>
<link rel="stylesheet" href="/style.css">
<main>
  <aside>
    <h1>Гекскроул</h1>
    <p id="role">Classic · 5–6 миль</p>
    <p>Позиция <output id="position">—</output></p>
    <p id="progress" role="status">Подключение…</p>
    <a id="join" hidden>Ссылка игроков</a>
    <div id="choices" aria-label="Направление хода"></div>
    <div id="master-controls" hidden>
      <button id="confirm" disabled>Подтвердить ход</button>
      <button id="cancel" disabled>Отменить</button>
    </div>
  </aside>
  <svg id="map" role="img" aria-label="Карта Classic seed 42"></svg>
</main>
<script type="module" src="/ui.mjs"></script>
</html>
