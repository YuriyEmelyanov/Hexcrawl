name: HX-BL-003 output asset audit
on:
  push:
    branches: [agent/hx-bl-003-performance]
    paths: [.github/workflows/hx-bl-003-output-audit.yml, scripts/hx-bl-003-verify-outputs.mjs]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hx-bl-003-output-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: HX-BL-003-baseline-outputs
          run-id: 40200788539
          github-token: ${{ github.token }}
          path: reports/HX-BL-003/baseline-outputs/
      - name: Unpack immutable input corpus
        run: |
          python - <<'PY'
          import hashlib,pathlib,zipfile
          p=pathlib.Path('reports/HX-BL-003/corpus/fixed-corpus.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='55dddd3df58d45ad33578678ec239e61d966c6972dbaa7e8cd2fd8c510ff5913'
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  assert not i.filename.startswith('/') and '..' not in pathlib.PurePosixPath(i.filename).parts
              z.extractall(p.parent)
          PY
      - name: Build exact baseline assets
        run: |
          git worktree add /tmp/hx003-audit-product 103d31b9f6f5c76b1f6b45d9d6664fe3f75dd63b
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/hx003-audit-product/node_modules
          cd /tmp/hx003-audit-product
          npm run build
          cp -R dist "$GITHUB_WORKSPACE/dist"
      - name: Check documents, artwork hashes and cancelled assets
        env:
          HX003_OUTPUT_MANIFEST_SHA256: ba8721a537d3df24c785d688a8453526e1fac90b7f9af2e6c06b64ab2ca92f06
        run: node scripts/hx-bl-003-verify-outputs.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HX-BL-003-output-audit
          path: reports/HX-BL-003/output-audit/
          if-no-files-found: error
