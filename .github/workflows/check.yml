name: HX062 reviewer reproduction
on:
  push:
    branches: ['review/hx062-rv04-5f600d5']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git diff --exit-code 5f600d559a7461c600a887aa5c6e5c939832ef3a -- src public index.html package.json package-lock.json vite.config.ts test/helpers test/fixtures
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4219 --strictPort > /tmp/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4219 > /dev/null && break; sleep 1; done
          node scripts/reviewer-rv04.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HX062-RV04-screenshot
          path: reports/reviewer-5f600d5/
          if-no-files-found: error
