name: Check
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          # Bounded P04 acceptance diagnostic for PR503; no legacy UI pin in other PRs.
          ONE_MILE_NATIVE6_BASELINE: ${{ github.event.pull_request.number == 503 && 'd41911b8d7c2248f115b182923350dc8d08c0a48' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-render-preview
          path: reports/terrain-v2-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HX-BL-024-UI
          path: reports/HX-BL-024/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HX-BL-041-UI
          path: reports/HX-BL-041/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ONE-MILE1-UI
          path: reports/ONE-MILE1-UI/
          if-no-files-found: ignore

  world-random:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:rng
