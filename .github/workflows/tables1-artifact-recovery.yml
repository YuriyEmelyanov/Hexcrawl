name: TABLES1 existing artifact recovery
on:
  push:
    branches: [agent-operations]
    paths: [.github/workflows/tables1-artifact-recovery.yml]
permissions:
  actions: read
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read immutable existing UI artifact without rebuild or tests
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, os, zipfile, io, json, base64, hashlib
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs): return None
          req=urllib.request.Request('https://api.github.com/repos/YuriyEmelyanov/Hexcrawl/actions/artifacts/13817705812/zip',headers={'Authorization':'Bearer '+os.environ['ARTIFACT_READ_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
            urllib.request.build_opener(NoRedirect).open(req,timeout=30)
            raise RuntimeError('Expected artifact redirect')
          except urllib.error.HTTPError as e:
            if e.code not in (301,302,303,307,308): raise
            target=e.headers['Location']
          if not target.startswith('https://'): raise RuntimeError('Expected TLS artifact URL')
          archive=urllib.request.urlopen(target,timeout=30).read()
          if hashlib.sha256(archive).hexdigest()!='910654b801e47d239d2334503353f3a26b93238e0e6adbe4b811f2c2258863fe': raise RuntimeError('Artifact digest differs')
          expected={'before-preparation-1500.png','before-preparation-390.png','actual-1500.png','actual-390.png','actual-320.png','selector-320.png','dirty-exit-320.png','actual-EN-390.png','metrics.json'}
          z=zipfile.ZipFile(io.BytesIO(archive))
          found={}
          for path in z.namelist():
            name=path.rsplit('/',1)[-1]
            if name in expected:
              if name in found: raise RuntimeError('Duplicate artifact filename')
              found[name]=z.read(path)
          if set(found)!=expected: raise RuntimeError('Artifact file set differs')
          for name,data in sorted(found.items()):
            encoded=base64.b64encode(data).decode('ascii')
            chunks=[encoded[i:i+12000] for i in range(0,len(encoded),12000)]
            print('RECOVERY_META '+json.dumps({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'blob_sha':hashlib.sha1(('blob '+str(len(data))+'\\0').encode()+data).hexdigest(),'chunks':len(chunks)}))
            for i,part in enumerate(chunks): print('RECOVERY_DATA '+json.dumps({'name':name,'part':i,'data':part}))
          print('RECOVERY_DONE existing artifact13817705812; no application source changes, build, tests or publication')
          PY
