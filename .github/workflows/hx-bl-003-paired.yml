name: HX-BL-003 P1 paired comparison
on:
  push:
    branches: [agent/hx-bl-003-performance]
    paths: [.github/workflows/hx-bl-003-paired.yml, scripts/hx-bl-003-paired.mjs]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: hx-bl-003-paired-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hx-bl-003-performance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: HX-BL-003-baseline-outputs
          run-id: 40200788539
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/HX-BL-003/baseline-outputs
      - name: Verify same frozen corpus and all42 output hashes
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          p=pathlib.Path('reports/HX-BL-003/corpus/fixed-corpus.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='55dddd3df58d45ad33578678ec239e61d966c6972dbaa7e8cd2fd8c510ff5913'
          with zipfile.ZipFile(p) as z:
              assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              z.extractall(p.parent)
          p=pathlib.Path('reports/HX-BL-003/baseline-outputs')
          m=json.loads((p/'manifest.json').read_text())
          assert len(m['files'])==42
          for f in m['files']:
              data=(p/f['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest()==f['sha256'] and len(data)==f['bytes']
          PY
      - name: Build baseline and exact candidate with identical probes
        run: |
          git worktree add --detach /tmp/hx003-pair-baseline 103d31b9f6f5c76b1f6b45d9d6664fe3f75dd63b
          git worktree add --detach /tmp/hx003-pair-candidate HEAD
          for variant in baseline candidate; do
            target="/tmp/hx003-pair-$variant"
            ln -s "$GITHUB_WORKSPACE/node_modules" "$target/node_modules"
            ln -s "$target" "/tmp/hx003-timing-product-$variant"
            node scripts/hx-bl-003-instrument.mjs "/tmp/hx003-timing-product-$variant"
            (cd "$target" && npx tsc --noEmit && npx vite build --sourcemap)
          done
      - name: Freeze paired environment before measurement
        run: |
          node scripts/hx-bl-003-environment.mjs
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const p='reports/HX-BL-003/timing-environment.json',env=JSON.parse(fs.readFileSync(p));
          env.phase='paired_environment_frozen_before_latency';
          env.candidate_sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          env.pair_order=['AB','BA','AB','BA','AB','BA','AB'];
          env.files.push({path:'scripts/hx-bl-003-paired.mjs',sha256:createHash('sha256').update(fs.readFileSync('scripts/hx-bl-003-paired.mjs')).digest('hex')});
          fs.writeFileSync('reports/HX-BL-003/paired-environment.json',JSON.stringify(env,null,2)+'\n');
          JS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore reports/HX-BL-003/timing-environment.json
          git add reports/HX-BL-003/paired-environment.json
          git commit -m "test(performance): freeze actual paired runner before AB/BA collection"
          git push origin HEAD:refs/heads/agent/hx-bl-003-performance
      - name: Paired cold warmup and five warm repetitions on seven checkpoints
        run: node scripts/hx-bl-003-paired.mjs
      - name: Compare full SVG and decoded PNG pixels
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image,ImageChops
          import pathlib,json
          p=pathlib.Path('reports/HX-BL-003/timing/paired');rows=[]
          files=list(p.glob('A-*.svg'));assert len(files)==7
          for a in files:
              b=a.with_name('B-'+a.name[2:]);assert a.read_bytes()==b.read_bytes(),a.name
              with Image.open(a.with_suffix('.png')) as x, Image.open(b.with_suffix('.png')) as y:
                  assert x.size==y.size
                  assert ImageChops.difference(x.convert('RGBA'),y.convert('RGBA')).getbbox(alpha_only=False) is None,a.name
                  rows.append({'checkpoint':a.name[2:-4],'svg_equal':True,'pixels_equal':True,'size':x.size})
          (p/'visual-parity.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HX-BL-003-P1-paired
          path: |
            reports/HX-BL-003/timing/paired/
            reports/HX-BL-003/paired-environment.json
          if-no-files-found: error
