name: PR503 Classic map preview
on:
  push:
    branches: [agent/pr503-classic-preview-20261115]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node classic-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PR503-classic-six-regions
          path: classic-preview/
          if-no-files-found: error
