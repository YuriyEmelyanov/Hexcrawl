<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HexCrawl — компактные теги</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8ecf2;background:#0f1726;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:760px}article{padding:12px;border:1px solid #2e4263;border-radius:10px;background:#101a2b;position:relative;font-size:16px;line-height:normal}.line{margin:.5rem 0;overflow-wrap:anywhere}.line:last-child{margin-bottom:0}.head{margin-top:0}.edit{float:right;margin:0 0 .35rem .5rem;width:44px;height:44px;border:1px solid #375386;border-radius:8px;background:transparent;color:#d9e4f4;font-size:25px;padding:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #bad0f3;outline-offset:2px}.dice{display:inline-flex;gap:2px;align-items:center;vertical-align:middle;white-space:nowrap;margin:0 2px}.die{display:inline-flex;width:18px;height:20px;align-items:center;justify-content:center;border:0;background:transparent;padding:0;position:relative}.die svg{width:16px;height:18px;overflow:visible}.die .shape{fill:#14243b;stroke:#6582ac;stroke-width:1.3}.die .facet{fill:none;stroke:#476286;stroke-width:.7}.die text{fill:#e8ecf2;font:bold 11px system-ui}.die:hover .shape{fill:#28466e}.die:disabled{cursor:default;opacity:.7}.result{margin-right:3px}.optional{font-size:14px;border:0;background:transparent;padding:1px 3px;color:#b8cbe6;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}.rolling svg{animation:roll .35s ease-in-out}.rolling text{animation:blink .35s ease-in-out}@keyframes roll{50%{transform:rotate(140deg) scale(.8)}to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.2}}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}.seers{margin-top:-3px}.badge{display:inline-block;background:#2396ec;color:white;border-radius:4px;line-height:1;padding:0 2px}@media(max-width:420px){body{padding:12px}article{padding:12px;font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style><article><button class="edit" aria-label="Редактировать"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m16 3 5 5-12 12-6 1 1-6Z M14 5 5 5"/></svg></button><p class="line head">Королевство: <b>Кальдланд</b></p><p class="line"><b>Местность Коперкам</b></p><p class="line" id="region">▲🌳 Мёртвый горный лес</p><p class="line"><b>Координаты гекса:</b> -2/6</p><p class="line">Местность: как в регионе</p><p class="line">Дикая местность</p><p class="line" id="object"></p><p class="line seers" id="seer" hidden></p><p class="line">⋯ Тропа 9</p><p class="line"><b>Рядом:</b></p><p class="line" id="river"><span class="badge">→Ⅲ</span> Река <b>Грюнфлусс</b> (пороги)</p><p class="line"><span class="badge">→Ⅲ</span>◉ Река <b>Линденфлусс</b> (водопад, пороги)</p></article><span id="live" class="sr" role="status"></span>
<script>
// Static layout proposal. Production dice behaviour is specified separately.
const selected=new URLSearchParams(location.search).get('object')||'monument';
const examples={monument:['⭐ 🗿 Монумент',[6,12],'Тихое пламя'],sanctum:['⭐ Святилище',[1,1],'Шепчущий ручей'],myth:['⭐ Миф',[6,12],'Скала'],dwelling:['⭐ Жилище',[6,12],'Башня философа'],hazard:['⭐ Опасность',[6,12],'Поле магмы'],curse:['⭐ Проклятие',[6,12],'Завеса мелкого дождя'],ruin:['⭐ Руины',[6,12],'Оскверненный склеп'],holding:['⭐ Удел',[1,2],['Тёмный','Башня']],throne:['⭐ Престол',[1,2],['Тёмный','Башня']],lake:['💧 Озеро Зеркальное',[1,6],['Хрустальная','Зеркало']],river:['Река Грюнфлусс',[1,6],['Хрустальная','Зеркало']]};
function die(sides,n){const shape=sides===6?'<rect class="shape" x="2" y="3" width="20" height="20" rx="3"/>':'<path class="shape" d="M12 1 23 9 19 23H5L1 9Z"/><path class="facet" d="M12 1 7 8H17L23 9M5 23 7 8M19 23 17 8"/>';return `<button class="die" aria-label="Перебросить куб d${sides}, выпало ${n}"><svg viewBox="0 0 24 26" aria-hidden="true">${shape}<text x="12" y="17.5" text-anchor="middle">${n}</text></svg></button>`}
function row(x){const [label,values,result]=x;return label+' '+(Array.isArray(result)?values.map((n,i)=>`<span class="dice">${die(12,n)}</span><span class="result">${result[i]}</span>`).join(' '):`<span class="dice">${die(6,values[0])}${die(12,values[1])}</span><span class="result">${result}</span>`)}
if(selected==='region'){document.querySelector('#region').innerHTML+=' '+['Земля','Флора','Фауна'].map(x=>`<button class="optional">${x}</button>`).join(' ');document.querySelector('#object').hidden=true}else if(selected==='river'){document.querySelector('#river').innerHTML=row(examples.river);document.querySelector('#object').hidden=true}else{document.querySelector('#object').innerHTML=row(examples[selected]||examples.monument);if(selected==='sanctum'){document.querySelector('#seer').hidden=false;document.querySelector('#seer').innerHTML=row(['Провидец',[1,2],'Раздутый Провидец'])}}
</script></html>
