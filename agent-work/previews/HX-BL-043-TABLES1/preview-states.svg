<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="310"><rect width="100%" height="100%" fill="#0c1423"/><text x="16" y="28" font-family="DejaVu Sans" font-size="16" fill="#a8c9fa">TBL-UI1 · дополнительные состояния предложения</text><rect x="12" y="50" width="354" height="230" rx="8" fill="#101c2f" stroke="#304c73"/><text x="26" y="80" font-family="DejaVu Sans" font-size="16" fill="#e4eaf2">Недоступная таблица</text><text x="26" y="118" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Исходная подсказка сохранена.</text><text x="26" y="145" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Таблица пока недоступна.</text><text x="26" y="172" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Результат не выдуман.</text><rect x="26" y="212" width="323" height="44" rx="6" fill="#13243b" stroke="#304c73"/><text x="36" y="240" font-family="DejaVu Sans" font-size="13" fill="#e4eaf2">Оставить без уточнения</text><rect x="380" y="50" width="354" height="230" rx="8" fill="#101c2f" stroke="#304c73"/><text x="394" y="80" font-family="DejaVu Sans" font-size="16" fill="#e4eaf2">Повторная ссылка</text><text x="394" y="118" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Выпавшая строка 8 сохранена.</text><text x="394" y="145" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Можно взять следующую: 9.</text><text x="394" y="172" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Третьего броска нет.</text><rect x="394" y="212" width="323" height="44" rx="6" fill="#13243b" stroke="#304c73"/><text x="404" y="240" font-family="DejaVu Sans" font-size="13" fill="#e4eaf2">Взять следующую строку</text><rect x="748" y="50" width="354" height="230" rx="8" fill="#101c2f" stroke="#304c73"/><text x="762" y="80" font-family="DejaVu Sans" font-size="16" fill="#e4eaf2">Граница таблицы</text><text x="762" y="118" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Выпавшая строка 100 сохранена.</text><text x="762" y="145" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Следующей строки нет.</text><text x="762" y="172" font-family="DejaVu Sans" font-size="14" fill="#e4eaf2">Вопрос остаётся открытым.</text><rect x="762" y="212" width="323" height="44" rx="6" fill="#13243b" stroke="#304c73"/><text x="772" y="240" font-family="DejaVu Sans" font-size="13" fill="#e4eaf2">Выбрать строку вручную</text><text x="16" y="300" font-family="DejaVu Sans" font-size="11" fill="#9aaeca">Макет состояний, не реализация. Синтетические подписи; выбор ведущего явный.</text></svg>