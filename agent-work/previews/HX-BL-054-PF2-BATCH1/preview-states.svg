<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950"><rect x="0" y="0" width="1200" height="950" rx="0" fill="#0c1423" stroke="#0c1423"/><rect x="0" y="0" width="1200" height="64" rx="0" fill="#0f1726" stroke="#0f1726"/><text x="16" y="25" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">HexCrawl · состояния PF2-UI1</text><text x="16" y="48" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="400">PF2-UI1 · предложение, не реализация</text><rect x="20" y="90" width="370" height="335" rx="10" fill="#0f1726" stroke="#375386"/><text x="36" y="122" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">Выключено</text><rect x="36" y="151" width="20" height="20" rx="4" fill="#0c1423" stroke="#375386"/><text x="68" y="168" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">PF2</text><text x="36" y="206" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">PF2 не выбран. Старые принятые</text><text x="36" y="230" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">места остаются видимыми.</text><rect x="415" y="90" width="370" height="335" rx="10" fill="#0f1726" stroke="#375386"/><text x="431" y="122" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">Нет новых единиц</text><rect x="431" y="151" width="20" height="20" rx="4" fill="#365792" stroke="#375386"/><text x="434" y="167" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">✓</text><text x="463" y="168" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">PF2</text><text x="431" y="206" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Все доступные единицы уже</text><text x="431" y="230" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">обработаны либо защищены.</text><rect x="431" y="326" width="338" height="44" rx="10" fill="#0c1423" stroke="#375386"/><text x="443" y="354" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Новых единиц нет</text><rect x="810" y="90" width="370" height="335" rx="10" fill="#0f1726" stroke="#375386"/><text x="826" y="122" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">Выполняется</text><rect x="826" y="151" width="20" height="20" rx="4" fill="#365792" stroke="#375386"/><text x="829" y="167" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">✓</text><text x="858" y="168" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">PF2</text><text x="826" y="206" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Наполняем 300 единиц… Повторное</text><text x="826" y="230" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">действие недоступно.</text><rect x="826" y="326" width="338" height="44" rx="10" fill="#0c1423" stroke="#375386"/><text x="838" y="354" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Наполнение…</text><rect x="20" y="455" width="370" height="335" rx="10" fill="#0f1726" stroke="#375386"/><text x="36" y="487" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">Готово</text><rect x="36" y="516" width="20" height="20" rx="4" fill="#365792" stroke="#375386"/><text x="39" y="532" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">✓</text><text x="68" y="533" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">PF2</text><text x="36" y="571" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Обработано 300. Добавлено 135</text><text x="36" y="595" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">мест. Защищено 18.</text><rect x="36" y="691" width="338" height="44" rx="10" fill="#365792" stroke="#375386"/><text x="48" y="719" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Заполнить новые</text><rect x="415" y="455" width="370" height="335" rx="10" fill="#0f1726" stroke="#375386"/><text x="431" y="487" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">Ошибка без потери карты</text><rect x="431" y="516" width="20" height="20" rx="4" fill="#365792" stroke="#375386"/><text x="434" y="532" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">✓</text><text x="463" y="533" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">PF2</text><text x="431" y="571" fill="#fca5a5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Не найден контент для окружения.</text><text x="431" y="595" fill="#fca5a5" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Карта не изменена.</text><rect x="431" y="691" width="338" height="44" rx="10" fill="#365792" stroke="#375386"/><text x="443" y="719" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Повторить после исправления</text><rect x="810" y="455" width="370" height="335" rx="10" fill="#0f1726" stroke="#375386"/><text x="826" y="487" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700">Есть черновик</text><rect x="826" y="516" width="20" height="20" rx="4" fill="#365792" stroke="#375386"/><text x="829" y="532" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">✓</text><text x="858" y="533" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">PF2</text><text x="826" y="571" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">Завершить описание перед</text><text x="826" y="595" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400">наполнением карты?</text><rect x="826" y="658" width="338" height="44" rx="10" fill="#365792" stroke="#375386"/><text x="838" y="686" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Завершить</text><rect x="826" y="710" width="158" height="44" rx="10" fill="#0c1423" stroke="#375386"/><text x="838" y="738" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Отбросить</text><rect x="994" y="710" width="170" height="44" rx="10" fill="#0c1423" stroke="#375386"/><text x="1006" y="738" fill="#e8ecf2" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Остаться</text><text x="24" y="857" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">Чекбокс не наполняет карту сам при переключении. При создании территории PF2 применяется к новым свободным единицам в общей</text><text x="24" y="879" fill="#aebbd4" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400">транзакции. Конкретные числа в макете — контролируемый пример.</text></svg>