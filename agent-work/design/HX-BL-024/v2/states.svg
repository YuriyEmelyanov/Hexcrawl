<svg xmlns="http://www.w3.org/2000/svg" width="480" height="790" viewBox="0 0 480 790">
<rect width="480" height="790" fill="#0f1521"/>
<g font-family="Arial, sans-serif" fill="#e8ecf2">
<text x="20" y="32" font-size="19" font-weight="bold">Заметки гекса — предлагаемый вид</text>
<text x="20" y="57" font-size="13" fill="#aebbd4">Корректировка по замечаниям владельца</text>
<text x="20" y="99" font-size="14" fill="#aebbd4">1. Заметки нет</text>
<rect x="16" y="114" width="448" height="72" rx="10" fill="#0f1726" stroke="#293f65"/>
<text x="32" y="157" font-size="16" fill="#c7d5ed">+ Добавить заметку</text>
<text x="20" y="230" font-size="14" fill="#aebbd4">2. Ввод текста</text>
<rect x="16" y="245" width="448" height="238" rx="10" fill="#0f1726" stroke="#293f65"/>
<text x="32" y="277" font-size="16" font-weight="bold">Заметки мастера</text>
<text x="284" y="276" font-size="12" fill="#aebbd4">◌ Сохраняется…</text>
<text x="434" y="276" font-size="15" fill="#aebbd4">⌃</text>
<rect x="32" y="294" width="416" height="166" rx="8" fill="#0c1423" stroke="#8fb4ef" stroke-width="2"/>
<text x="45" y="324" font-size="16">У старого брода замечены следы.</text>
<text x="45" y="349" font-size="16">Мельник знает безопасную тропу</text>
<text x="45" y="374" font-size="16">через лес.</text>
<line x1="125" y1="359" x2="125" y2="379" stroke="#e8ecf2"/>
<text x="20" y="529" font-size="14" fill="#aebbd4">3. Текст сохранён, редактор закрыт</text>
<rect x="16" y="544" width="448" height="162" rx="10" fill="#0f1726" stroke="#293f65"/>
<text x="32" y="577" font-size="16" font-weight="bold">Заметки мастера</text>
<text x="316" y="576" font-size="12" fill="#aebbd4">✓ Сохранено</text>
<text x="434" y="576" font-size="15" fill="#aebbd4">⌄</text>
<text x="32" y="614" font-size="16">У старого брода замечены следы.</text>
<text x="32" y="639" font-size="16">Мельник знает безопасную тропу</text>
<text x="32" y="664" font-size="16">через лес.</text>
<text x="20" y="748" font-size="13" fill="#aebbd4">Нажатие на заголовок или текст открывает ввод.</text>
<text x="20" y="770" font-size="13" fill="#aebbd4">Без подписи и кнопок «Сохранить» / «Отменить».</text>
</g></svg>