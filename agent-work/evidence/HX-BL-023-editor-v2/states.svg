<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="650" viewBox="0 0 1280 650"><rect width="100%" height="100%" fill="#0f1521"/><rect x="0" y="0" width="1280" height="60" rx="0" fill="#1a2942" stroke="#375386"/><text x="20" y="36" fill="#e8ecf2" font-size="20" font-weight="700" font-family="DejaVu Sans,sans-serif">ПРЕДЛОЖЕНИЕ 2.0 · Состояния переименования</text><rect x="20" y="84" width="400" height="220" rx="10" fill="#142035" stroke="#375386"/><text x="36" y="118" fill="#e8ecf2" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Выбор объекта</text><text x="36" y="154" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Каталог: регион, поселение, река,</text><text x="36" y="175" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">озеро, королевство. Все живые</text><text x="36" y="196" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">именованные объекты.</text><rect x="36" y="244" width="368" height="44" rx="10" fill="#0c1423" stroke="#375386"/><text x="48" y="272" fill="#e8ecf2" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Изменить название</text><rect x="440" y="84" width="400" height="220" rx="10" fill="#142035" stroke="#375386"/><text x="456" y="118" fill="#e8ecf2" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Черновик</text><text x="456" y="154" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Русское: Эринин. English: Erinin.</text><text x="456" y="175" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">До сохранения карта содержит</text><text x="456" y="196" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">прежние имена.</text><rect x="456" y="244" width="368" height="44" rx="10" fill="#365792" stroke="#375386"/><text x="468" y="272" fill="#e8ecf2" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Сохранить название</text><rect x="860" y="84" width="400" height="220" rx="10" fill="#142035" stroke="#375386"/><text x="876" y="118" fill="#e8ecf2" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Ошибка</text><text x="876" y="154" fill="#ffb4b4" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Такое русское название уже есть.</text><text x="876" y="175" fill="#ffb4b4" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Измените поле; второе место не</text><text x="876" y="196" fill="#ffb4b4" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">переименовывается.</text><rect x="20" y="324" width="400" height="220" rx="10" fill="#142035" stroke="#375386"/><text x="36" y="358" fill="#e8ecf2" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Переход с правкой</text><text x="36" y="394" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Сохранить / Отбросить / Остаться.</text><text x="36" y="415" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Переход не теряет черновик без</text><text x="36" y="436" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">вашего выбора.</text><rect x="440" y="324" width="400" height="220" rx="10" fill="#142035" stroke="#375386"/><text x="456" y="358" fill="#e8ecf2" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Карта изменилась</text><text x="456" y="394" fill="#ffb4b4" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Выберите объект заново. Устаревшая</text><text x="456" y="415" fill="#ffb4b4" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">форма не записывает имя в другую</text><text x="456" y="436" fill="#ffb4b4" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">карту.</text><rect x="860" y="324" width="400" height="220" rx="10" fill="#142035" stroke="#375386"/><text x="876" y="358" fill="#e8ecf2" font-size="18" font-weight="700" font-family="DejaVu Sans,sans-serif">Сохранено</text><text x="876" y="394" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">Название сохранено. Один Undo</text><text x="876" y="415" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">возвращает оба прежних имени;</text><text x="876" y="436" fill="#e8ecf2" font-size="15" font-weight="400" font-family="DejaVu Sans,sans-serif">русло и связи не изменены.</text><rect x="876" y="484" width="368" height="44" rx="10" fill="#0c1423" stroke="#375386"/><text x="888" y="512" fill="#e8ecf2" font-size="14" font-weight="400" font-family="DejaVu Sans,sans-serif">Отменить</text><text x="20" y="615" fill="#aebbd4" font-size="13" font-weight="400" font-family="DejaVu Sans,sans-serif">Общий дизайн не означает реализации остальных инструментов или готовности к приглашению ведущих.</text></svg>