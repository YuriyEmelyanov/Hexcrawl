<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="516" viewBox="0 0 880 516" role="img" aria-labelledby="title desc">
  <title id="title">Столица на лесном гексе</title>
  <desc id="desc">Макет: корона из набора v2 размером 24 на 24 единицы по центру гекса высотой 56. Слева один гекс увеличен в четыре раза; справа семь лесных гексов увеличены вдвое. Использован текущий тайл равнинного лиственного леса. Прямое наложение без изменения значка и деревьев.</desc>
  <defs>
    <clipPath id="hex-clip"><polygon points="24.248711,-14.000000 24.248711,14.000000 0.000000,28.000000 -24.248711,14.000000 -24.248711,-14.000000 -0.000000,-28.000000"/></clipPath>
    <g id="forest-hex">
      <polygon points="24.248711,-14.000000 24.248711,14.000000 0.000000,28.000000 -24.248711,14.000000 -24.248711,-14.000000 -0.000000,-28.000000" fill="#7AAD43"/>
      <g clip-path="url(#hex-clip)">
        <image x="-24.248711" y="-28" width="48.497423" height="56" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/png;base64,"/>
      </g>
      <polygon points="24.248711,-14.000000 24.248711,14.000000 0.000000,28.000000 -24.248711,14.000000 -24.248711,-14.000000 -0.000000,-28.000000" fill="none" stroke="#617187" stroke-width="1"/>
    </g>
    <g id="capital" transform="translate(-12 -12) scale(0.375)" fill="#26332b" fill-rule="evenodd">
      <path d="M7 16 20 27 32 8 44 27 57 16 49 55H15Z"/>
    </g>
  </defs>
  <rect width="880" height="516" fill="#f5f3eb"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#26332b">
    <text x="36" y="49" font-size="27" font-weight="700">Столица на лесном гексе</text>
    <text x="36" y="79" font-size="14" fill="#647060">Корона v2 · равнинный лиственный лес из текущей карты</text>
    <line x1="36" y1="103" x2="844" y2="103" stroke="#d9ded0"/>
    <text x="237" y="137" text-anchor="middle" font-size="15" font-weight="600">Один гекс · ×4</text>
    <text x="640" y="137" text-anchor="middle" font-size="15" font-weight="600">Фрагмент карты · ×2</text>
    <g transform="translate(237 291) scale(4)">
      <use href="#forest-hex"/>
      <use href="#capital"/>
    </g>
    <g transform="translate(640 291) scale(2)">
      <use href="#forest-hex" transform="translate(0.000000 0.000000)"/><use href="#forest-hex" transform="translate(48.497423 0.000000)"/><use href="#forest-hex" transform="translate(24.248711 42.000000)"/><use href="#forest-hex" transform="translate(-24.248711 42.000000)"/><use href="#forest-hex" transform="translate(-48.497423 0.000000)"/><use href="#forest-hex" transform="translate(-24.248711 -42.000000)"/><use href="#forest-hex" transform="translate(24.248711 -42.000000)"/><use href="#capital"/>
    </g>
    <line x1="36" y1="453" x2="844" y2="453" stroke="#d9ded0"/>
    <text x="36" y="480" font-size="13" fill="#647060">Макет для оценки · значок 24 × 24 на гексе высотой 56 · прямое наложение</text>
  </g>
</svg>
